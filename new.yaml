openapi: 3.0.0
info:
  title: Demo API
  version: 1.1.1
paths:
  /users:
    get:
      summary: Get users
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
  /users/{id}:
    get:
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
  /products:
    get:
      summary: Get products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
